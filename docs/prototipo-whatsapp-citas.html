<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mederi · Reserva de cita</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#193c38;background:#e8f1ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}.wrap{width:min(1040px,100%);display:grid;grid-template-columns:1fr 380px;gap:70px;align-items:center}.intro .eyebrow{font-weight:700;letter-spacing:.14em;font-size:12px;color:#197b67}.intro h1{font-size:clamp(38px,5vw,62px);line-height:1.04;letter-spacing:-.055em;margin:18px 0}.intro p{font-size:18px;line-height:1.6;color:#527069;max-width:490px}.pill{display:inline-block;border:1px solid #bdd8ca;border-radius:99px;padding:9px 14px;color:#356b5d;font-size:13px}.phone{background:#fafcfb;border-radius:32px;box-shadow:0 30px 90px #285e4430;overflow:hidden;border:8px solid #173e37;min-height:680px;display:flex;flex-direction:column}.top{background:#075e50;color:white;padding:20px 20px 17px;display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:14px;background:#d9efe7;color:#075e50;display:grid;place-items:center;font-weight:800}.top strong{display:block;font-size:15px}.top small{opacity:.8}.sheet{padding:26px 22px;flex:1}.progress{display:flex;gap:5px;margin-bottom:27px}.progress i{height:4px;background:#dcebe4;flex:1;border-radius:8px}.progress i.on{background:#26a57e}.kicker{color:#168367;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}h2{font-size:26px;letter-spacing:-.04em;margin:9px 0 7px}p.sub{font-size:14px;color:#718781;line-height:1.5;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #d8e8e0;background:white;text-align:left;color:#24473e;border-radius:14px;padding:14px 12px;font:inherit;cursor:pointer}.option small{display:block;color:#839991;margin-top:3px}.option.sel{border-color:#159a73;background:#e9f8f1;box-shadow:0 0 0 1px #159a73}.field{width:100%;border:1px solid #ccdcd4;border-radius:13px;background:white;font:inherit;padding:14px;margin:8px 0 17px;color:#193c38}label{font-size:13px;font-weight:700}.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dates select{min-width:0;border:1px solid #ccdcd4;border-radius:10px;padding:11px 3px;background:white;color:#193c38}.note{font-size:12px;color:#748a82;line-height:1.5;margin-top:16px}.actions{display:flex;gap:10px;margin-top:24px}.primary,.back{border:0;border-radius:13px;padding:14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:#0a8d67;color:white;flex:1}.back{background:#e7f1ec;color:#315c4e}.summary{border:1px solid #dcebe4;border-radius:16px;padding:16px;background:white;font-size:14px;line-height:1.9}.summary span{color:#6a8179}.done{background:#e7f8ef;border-radius:50%;width:64px;height:64px;display:grid;place-items:center;font-size:30px;color:#16845f;margin-bottom:20px}@media(max-width:760px){.wrap{grid-template-columns:1fr;gap:25px;max-width:380px}.intro h1{font-size:38px}.intro p{font-size:15px}.phone{min-height:640px}}
</style></head><body><main class="wrap"><section class="intro"><div class="eyebrow">MEDERI · DISEÑO CONCEPTUAL</div><h1>Tu cita, sin complicaciones.</h1><p>Una propuesta visual para elegir profesional, día y hora en WhatsApp. Es una simulación con datos ficticios: no crea reservas.</p><div class="pill">Prototipo · la apariencia final depende de WhatsApp</div></section><section class="phone" aria-label="Simulación de reserva"><header class="top"><div class="mark">M</div><div><strong>Mederi · Citas</strong><small>Reserva fácil y segura</small></div></header><div class="sheet"><div class="progress" id="progress"></div><div id="screen"></div></div></section></main><script>
const state={step:0,professional:'',day:'',hour:'',name:'',dob:''};const screen=document.getElementById('screen');const progress=document.getElementById('progress');
const screens=[{tag:'Tu profesional',title:'¿Con quién te gustaría venir?',sub:'Elige al profesional que prefieras.',items:[['Dra. Carmen Prieto','Atención en consulta'],['Dr. Manuel Soto','Atención en consulta']],key:'professional'},{tag:'Tu cita',title:'Elige un día',sub:'Estas fechas son solo una muestra visual.',items:[['Mié 18 nov','Disponible'],['Jue 19 nov','Disponible'],['Vie 20 nov','Disponible'],['Lun 23 nov','Disponible']],key:'day'},{tag:'Tu cita',title:'¿Qué hora te viene bien?',sub:'Horarios de ejemplo para la fecha elegida.',items:[['09:00','Mañana'],['10:30','Mañana'],['12:00','Mediodía'],['17:00','Tarde']],key:'hour'}];
function render(){progress.innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<=state.step?'on':''}"></i>`).join('');if(state.step<3){let p=screens[state.step];screen.innerHTML=`<div class="kicker">${p.tag}</div><h2>${p.title}</h2><p class="sub">${p.sub}</p><div class="grid">${p.items.map(([v,d])=>`<button class="option ${state[p.key]===v?'sel':''}" data-value="${v}">${v}<small>${d}</small></button>`).join('')}</div><div class="actions">${state.step?'<button class="back" id="back">Atrás</button>':''}<button class="primary" id="next">Continuar</button></div>`;screen.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{state[p.key]=b.dataset.value;render()});}else if(state.step===3){screen.innerHTML=`<div class="kicker">Un último detalle</div><h2>¿Cómo te llamas?</h2><p class="sub">Escribe tu nombre completo y selecciona tu fecha de nacimiento.</p><label for="name">Nombre y apellidos</label><input id="name" class="field" autocomplete="name" placeholder="Tu nombre completo"><label>Fecha de nacimiento</label><div class="dates"><select id="day"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select><select id="month"><option value="">Mes</option>${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select><select id="year"><option value="">Año</option>${Array.from({length:110},(_,i)=>`<option>${2026-i}</option>`).join('')}</select></div><p class="note">La fecha se usa para ayudar a identificar correctamente al paciente.</p><div class="actions"><button class="back" id="back">Atrás</button><button class="primary" id="next">Ver resumen</button></div>`;document.getElementById('name').value=state.name;}else if(state.step===4){screen.innerHTML=`<div class="kicker">Todo preparado</div><h2>Revisa tu cita</h2><p class="sub">Confirma los detalles antes de reservar.</p><div class="summary"><span>Profesional</span><br>${safe(state.professional)}<br><span>Fecha y hora</span><br>${safe(state.day)} · ${safe(state.hour)}<br><span>Paciente</span><br>${safe(state.name)}</div><div class="actions"><button class="back" id="back">Atrás</button><button class="primary" id="next">Confirmar cita</button></div>`;}else{screen.innerHTML='<div class="done">✓</div><div class="kicker">Simulación terminada</div><h2>Así se vería tu confirmación.</h2><p class="sub">Este prototipo no ha creado ninguna cita ni enviado datos.</p><div class="actions"><button class="primary" id="restart">Empezar de nuevo</button></div>';document.getElementById('restart').onclick=()=>{state.step=0;render()};}let back=document.getElementById('back');if(back)back.onclick=()=>{state.step--;render()};let next=document.getElementById('next');if(next)next.onclick=()=>{if(state.step<3&&!state[screens[state.step].key])return;if(state.step===3){state.name=document.getElementById('name').value.trim();if(!state.name||!document.getElementById('day').value||!document.getElementById('month').value||!document.getElementById('year').value)return;}state.step++;render()};}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}render();
</script></body></html>
