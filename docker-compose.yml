services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Loopback only: this dev database uses the default postgres/postgres
      # superuser and shouldn't be reachable from the rest of the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - otolaryn_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  otolaryn_pgdata:
